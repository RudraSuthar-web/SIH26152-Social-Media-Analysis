# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file as well as the filename.
# string value; leave blank for local time
timezone = UTC

max_length_of_identifier = 63

# sys.path path, inserted in front of sys.path if set.
# defaults to the current working directory.
prepend_sys_path = .

# version path separator; As mentioned above, this is the character used to split
# version_locations. The default setting is "os"
version_path_separator = os

# set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# sqlalchemy.url is populated dynamically in env.py from app.config
sqlalchemy.url = sqlite+aiosqlite:///./social_analytics.db

[post_write_hooks]

[logging]
default_handler = console

[loggers]
keys = root, alembic, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
